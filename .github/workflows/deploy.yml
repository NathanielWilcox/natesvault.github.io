name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: site
      - name: Build site
        run: npm run build
        working-directory: site
      - name: Verify project-page asset paths
        run: |
          grep -q 'src="./assets/' site/dist/index.html
          grep -q 'href="./assets/' site/dist/index.html
      - name: Test site with coverage
        run: npm run test:coverage
        working-directory: site
      - name: Add Starboard demo to Pages artifact
        run: |
          mkdir -p site/dist/starboard
          cp apps/starboard/index.html apps/starboard/style.css apps/starboard/counter.js site/dist/starboard/
          test -f site/dist/starboard/index.html
          test -f site/dist/starboard/style.css
          test -f site/dist/starboard/counter.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
